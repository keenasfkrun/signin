<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KEENASFK — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #E8192C; --blush: #F2BFBF; --charcoal: #444444; --white: #FFFFFF; --off-white: #F7F5F2; }
  body { background: var(--charcoal); min-height: 100vh; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 0 0 48px; color: var(--white); overflow-x: hidden; }
  .hero { width: 100%; background: var(--red); padding: 36px 24px 52px; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%); }
  .brand-name { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 38px; letter-spacing: -1px; color: var(--white); line-height: 1; text-transform: uppercase; }
  .brand-sub { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-top: 6px; }
  .card { background: var(--white); border-radius: 20px; padding: 32px 28px; width: calc(100% - 40px); max-width: 420px; margin-top: -16px; box-shadow: 0 24px 48px rgba(0,0,0,0.3); }
  .card-heading { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 22px; color: var(--charcoal); text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 4px; }
  .card-sub { font-size: 14px; color: #888; margin-bottom: 28px; }
  .field-group { margin-bottom: 20px; }
  label { display: block; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--charcoal); margin-bottom: 8px; }
  input[type="text"] { width: 100%; border: 2px solid #E8E8E8; border-radius: 12px; padding: 14px 16px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: var(--charcoal); background: var(--off-white); outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  input[type="text"]:focus { border-color: var(--red); background: var(--white); }
  .insta-wrap { position: relative; }
  .insta-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #aaa; pointer-events: none; }
  .insta-wrap input { padding-left: 30px; }
  .field-hint { font-size: 12px; color: #aaa; margin-top: 6px; font-family: 'DM Sans', sans-serif; }
  .field-hint strong { color: #888; }
  .submit-btn { width: 100%; background: var(--red); color: var(--white); border: none; border-radius: 12px; padding: 16px; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; margin-top: 8px; -webkit-appearance: none; }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  .divider { height: 1px; background: #F0F0F0; margin: 24px 0; }
  .run-info { display: flex; gap: 12px; }
  .info-chip { display: flex; align-items: center; gap: 8px; background: var(--off-white); border-radius: 10px; padding: 10px 12px; flex: 1; }
  .chip-icon { font-size: 18px; }
  .chip-label { font-size: 10px; color: #999; font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .chip-value { font-size: 12px; color: var(--charcoal); font-weight: 500; }
  .success-screen { display: none; text-align: center; padding: 20px 0 8px; }
  .success-icon { width: 64px; height: 64px; background: #E8F7EF; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px; }
  .success-title { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 22px; color: var(--charcoal); text-transform: uppercase; margin-bottom: 8px; }
  .success-sub { font-size: 15px; color: #888; line-height: 1.6; }
  .success-sub span { color: var(--red); font-weight: 600; }
  .follow-cta { display: inline-flex; align-items: center; gap: 8px; background: var(--charcoal); color: var(--white); border-radius: 10px; padding: 12px 20px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; margin-top: 20px; }
  .footer-note { font-size: 12px; color: rgba(255,255,255,0.35); text-align: center; margin-top: 24px; }
  .error-msg { font-size: 12px; color: var(--red); margin-top: 6px; display: none; font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .week-badge { display: inline-block; background: var(--blush); color: var(--red); font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="hero">
  <div class="brand-name">KEENASFK</div>
  <div class="brand-sub">Run Club · Melbourne</div>
</div>

<div class="card">
  <div id="form-screen">
    <div class="week-badge" id="week-badge">Loading…</div>
    <div class="card-heading">Sign In</div>
    <div class="card-sub">Let us know you're here 👟</div>
    <div class="field-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="First & Last Name"
